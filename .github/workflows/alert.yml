name: DART 실적 공시 알림

on:
  schedule:
    # 평일 KST 07:00~20:59, 5분 간격 (GitHub cron은 UTC 기준. 정각 혼잡을 피해 3분부터 시작)
    - cron: "3-58/5 22-23 * * 0-4"   # KST 07~08시 (월~금)
    - cron: "3-58/5 0-11 * * 1-5"    # KST 09~20시 (월~금)
  workflow_dispatch: {}              # Actions 화면에서 수동 실행 버튼

permissions:
  contents: write                    # state/seen.json 커밋용

concurrency:
  group: dart-alert                  # 앞 실행이 안 끝났으면 다음 실행은 대기(중복 알림 방지)
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 신규 공시 확인 및 알림
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUARTER: ${{ vars.QUARTER || '2026Q3' }}
          PASSED_ONLY: ${{ vars.PASSED_ONLY || '0' }}
          INCLUDE_PERIODIC: ${{ vars.INCLUDE_PERIODIC || '1' }}
        run: python alert.py
      - name: 알린 공시 기록 저장
        run: |
          git config user.name "dart-alert-bot"
          git config user.email "dart-alert-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "state update" && git push)
