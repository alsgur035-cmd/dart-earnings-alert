name: DART 실적 공시 알림

# 2026-10-22 변경: GitHub 예약 실행(cron)이 5분 간격으로 안 돌고 하루 2~4번(4~5시간 간격)만 돌아서
# 알림이 몇 시간씩 늦었다. 이제 한 번 켜지면 실행 안에서 직접 5분마다 확인(최대 5시간 30분)하고,
# 끝날 때 다음 실행을 스스로 이어 붙인다(workflow_dispatch). cron은 아침 시동·끊겼을 때 복구용.
on:
  schedule:
    - cron: "3-58/5 22-23 * * 0-4"   # KST 07~08시 (월~금)
    - cron: "3-58/5 0-11 * * 1-5"    # KST 09~20시 (월~금)
  workflow_dispatch:
    inputs:
      once:
        description: "한 번만 확인 (운영시간 밖에서도 실행)"
        type: boolean
        default: false

permissions:
  contents: write                    # state/seen.json 커밋용
  actions: write                     # 다음 실행 이어 붙이기용

concurrency:
  group: dart-alert                  # 동시에 하나만 실행. 대기 중인 것은 최신 1개만 남음
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 5분마다 공시 확인 및 알림
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUARTER: ${{ vars.QUARTER || '2026Q3' }}
          PASSED_ONLY: ${{ vars.PASSED_ONLY || '0' }}
          INCLUDE_PERIODIC: ${{ vars.INCLUDE_PERIODIC || '1' }}
          ONCE: ${{ inputs.once && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "dart-alert-bot"
          git config user.email "dart-alert-bot@users.noreply.github.com"
          save_state() {
            git add state/seen.json
            git diff --cached --quiet || { git commit -q -m "state update" && git pull -q --rebase && git push -q; }
          }
          in_hours() {  # 평일 KST 07:00~20:59
            [ "$(TZ=Asia/Seoul date +%u)" -le 5 ] && [ "$(TZ=Asia/Seoul date +%H)" -ge 7 ] && [ "$(TZ=Asia/Seoul date +%H)" -lt 21 ]
          }
          if [ "$ONCE" = "1" ]; then
            python alert.py; save_state; exit 0
          fi
          end=$(( $(date +%s) + 330*60 ))
          while in_hours; do
            python alert.py || echo "이번 확인 실패 — 5분 뒤 다시 시도"
            save_state
            if [ "$(date +%s)" -ge "$end" ]; then
              echo "5시간 30분 경과 — 다음 실행 이어 붙임"
              gh workflow run alert.yml --ref "$GITHUB_REF_NAME"
              exit 0
            fi
            sleep 300
          done
          echo "운영시간(평일 07~21시) 종료"
